<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaler Persona Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            background: white;
        }

        .sidebar {
            width: 320px;
            background: linear-gradient(180deg, #f8f9ff 0%, #ffffff 100%);
            border-right: 1px solid #e8eaff;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 4px 0 20px rgba(102, 126, 234, 0.08);
        }

        .sidebar h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .persona-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .persona-btn {
            padding: 16px 18px;
            border: 2px solid #e8eaff;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .persona-btn:hover {
            background: #f0f2ff;
            border-color: #667eea;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .persona-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            transform: scale(1.02);
        }
        
        .persona-btn div:first-child {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .persona-btn div:last-child {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .persona-btn.active div:last-child {
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 28px 32px;
            border-bottom: none;
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 400;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafbfc;
        }
        
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }
        
        .messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 65%;
            padding: 14px 18px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e8eaff;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 14px 18px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.4;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        .input-area {
            padding: 20px 32px 28px;
            border-top: 1px solid #e8eaff;
            background: white;
            display: flex;
            gap: 12px;
        }

        .input-field {
            flex: 1;
            border: 2px solid #e8eaff;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .input-field::placeholder {
            color: #aaa;
        }

        .send-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .suggestion-chip {
            padding: 9px 14px;
            background: white;
            border: 1.5px solid #e8eaff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            color: #667eea;
            font-weight: 500;
        }

        .suggestion-chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
            animation: slideIn 0.3s ease;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 110px;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 16px;
            }

            .container {
                flex-direction: column;
            }

            .persona-buttons {
                flex-direction: row;
                overflow-x: auto;
                gap: 10px;
            }
            
            .persona-btn {
                flex-shrink: 0;
                min-width: 160px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .chat-header {
                padding: 20px 16px;
            }

            .chat-header h1 {
                font-size: 18px;
            }
            
            .messages {
                padding: 16px;
                gap: 12px;
            }
            
            .input-area {
                padding: 16px;
                gap: 8px;
            }
            
            .send-btn {
                padding: 12px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
